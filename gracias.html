<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;family=Sen:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: inherit; }
  a:hover { color: #e2211c; }
  @keyframes fgFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes ballA { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-24px) rotate(4deg); } }
  @keyframes ballC { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-19px) rotate(5deg); } }
  @keyframes fgDrift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { [data-cloud] { animation: none !important; } }
</style>
</helmet>

<div aria-hidden="true" style="position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#daecff 0%,#eef6ff 45%,#ffffff 78%)">
  <div data-cloud="" style="position:absolute;top:4%;left:0;width:200%;height:38vh;background-repeat:repeat-x;background-size:50% 100%;background-image:radial-gradient(ellipse 15% 52% at 9% 52%,#c2daf4 0%,rgba(194,218,244,0) 72%),radial-gradient(ellipse 9% 34% at 18% 62%,#cee1f7 0%,rgba(206,225,247,0) 72%),radial-gradient(ellipse 19% 46% at 58% 44%,#bcd7f3 0%,rgba(188,215,243,0) 74%),radial-gradient(ellipse 8% 30% at 78% 58%,#d2e3f8 0%,rgba(210,227,248,0) 72%);animation:fgDrift 62s linear infinite"></div>
  <div data-cloud="" style="position:absolute;top:38%;left:0;width:200%;height:44vh;opacity:.9;background-repeat:repeat-x;background-size:50% 100%;background-image:radial-gradient(ellipse 22% 44% at 26% 50%,#c6ddf5 0%,rgba(198,221,245,0) 74%),radial-gradient(ellipse 12% 32% at 44% 64%,#d4e5f9 0%,rgba(212,229,249,0) 72%),radial-gradient(ellipse 17% 40% at 84% 46%,#c2daf4 0%,rgba(194,218,244,0) 74%);animation:fgDrift 95s linear infinite reverse"></div>
  <div data-cloud="" style="position:absolute;top:66%;left:0;width:200%;height:40vh;opacity:.8;background-repeat:repeat-x;background-size:50% 100%;background-image:radial-gradient(ellipse 26% 40% at 16% 46%,#cbe0f7 0%,rgba(203,224,247,0) 76%),radial-gradient(ellipse 18% 34% at 66% 56%,#d8e8fa 0%,rgba(216,232,250,0) 74%);animation:fgDrift 135s linear infinite"></div>
</div>

<div style="--font-display:'Sora',sans-serif;--font-body:'Sen',sans-serif;--red:#e2211c;--red-mid:#c81b18;--red-tint:#fbe6e3;--cream:#f6efe4;--ink:#2a201c;--muted:#6f635a;position:relative;min-height:100vh;box-sizing:border-box;background:transparent;color:var(--ink);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(24px,5vw,64px);overflow:hidden">

  <a href="index.html" style="position:absolute;top:clamp(18px,3vw,32px);left:clamp(16px,4vw,44px);display:inline-flex;align-items:center;text-decoration:none">
    <img src="img/logo.png" alt="Ficticios Gigantes" style="height:46px;width:auto;display:block">
  </a>

  <div style="position:relative;display:inline-flex;flex-direction:column;align-items:center">
  <div style="position:absolute;left:clamp(-58px,-6vw,-30px);top:clamp(-40px,-5vw,-20px);width:clamp(64px,7vw,120px);pointer-events:none;z-index:2">
    <img src="img/ball-1.png" alt="" aria-hidden="true" style="width:100%;height:auto;display:block;animation:ballA 6.5s ease-in-out infinite;filter:drop-shadow(0 16px 24px rgba(42,32,28,.16))">
  </div>
  <div style="position:absolute;right:clamp(-52px,-5.5vw,-26px);bottom:clamp(-30px,-4vw,-14px);width:clamp(58px,6vw,108px);pointer-events:none;z-index:2">
    <img src="img/ball-2.png" alt="" aria-hidden="true" style="width:100%;height:auto;display:block;animation:ballC 7.6s ease-in-out infinite .6s;filter:drop-shadow(0 14px 22px rgba(42,32,28,.16))">
  </div>

  <img src="img/gracias.png" alt="¡Gracias!" style="width:min(620px,82vw);height:auto;display:block;animation:fgFloat 5.5s ease-in-out infinite;filter:drop-shadow(0 20px 34px rgba(226,33,28,.22))">
  </div>
  <h1 style="font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3.2vw,40px);line-height:1.05;letter-spacing:-.015em;color:var(--ink);margin:clamp(20px,3vw,36px) 0 0">Recibimos tu mensaje.</h1>
  <p style="font-size:clamp(15px,1.4vw,18px);line-height:1.6;color:var(--muted);margin:14px 0 0;max-width:48ch">Nos pondremos en contacto contigo a la brevedad posible para conversar tu próximo gigante.</p>
  <a href="index.html" style="margin-top:clamp(26px,3vw,38px);display:inline-flex;align-items:center;gap:11px;text-decoration:none;background:var(--ink);color:var(--cream);font-family:var(--font-display);font-weight:600;font-size:16px;padding:11px 12px 11px 26px;border-radius:999px" style-hover="background:var(--red)">
    Volver al inicio
    <span style="width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>
  </a>

</div>
</x-dc>
</body>
</html>
